services:
  nachtlijn:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nachtlijn-radar
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NS_API_KEY=${NS_API_KEY:-}
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
